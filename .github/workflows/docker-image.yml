name: Promote Verified Integration Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-integration-latest
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SOURCE_DIGEST: sha256:c407f02e68d21f25bddba70bf6b9e52bb881c1695ff9874f50bd6137f18a3d43

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image as latest
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}@${SOURCE_DIGEST}"
